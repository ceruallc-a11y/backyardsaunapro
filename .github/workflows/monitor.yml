name: Weekly revenue and SEO monitor

on:
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:seo
      - run: npm run audit:affiliates
        if: always()
      - run: npm run audit:lead-api
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-revenue-seo-monitor
          path: |
            reports/seo-followup-latest.md
            data/affiliate-link-inventory.csv
